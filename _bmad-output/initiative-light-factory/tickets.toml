# tickets.toml — initiative-light-factory's agreed children.
# Epic 1 built CAP-1..CAP-9 as one tightly coupled loop, one owner (see initiative Notes).
# Epic 2 closes the gaps epic 1's 2026-10-10 live run surfaced against those same capabilities.
# Epic 3 makes the checks configurable per repo and owns what epics 1 and 2 left open.
# Epic 4 replaces the GitHub-Environment gate mechanism with an AWS Lambda orchestrator
# reading a PR-comment command grammar, so the blueprint works on a non-Enterprise private
# repo (reopened 2026-11-03). Epic 5 is the UI front door onto the same mechanism --
# additive, not a dependency of epic 4's Done when.

[[epic]]
id = 1
slug = "epic-light-factory-pipeline"
title = "The gated delivery pipeline"
covers = ["CAP-1", "CAP-2", "CAP-3", "CAP-4", "CAP-5", "CAP-6", "CAP-7", "CAP-8", "CAP-9"]

[[epic]]
id = 2
slug = "epic-pipeline-open-issues"
title = "Closing the pipeline's open issues"
covers = ["CAP-1", "CAP-2", "CAP-3", "CAP-8"]
after = [{ epic = 1, needs = "the built, live-proven pipeline" }]

[[epic]]
id = 3
slug = "epic-pipeline-hardening"
title = "Configurable checks and the pipeline's remaining gaps"
covers = ["CAP-1", "CAP-2", "CAP-3", "CAP-5"]
after = [{ epic = 2, needs = "the six-job pipeline with the clarification loop, supersession, and reject-closing built" }]

[[epic]]
id = 4
slug = "epic-orchestrator-gates"
title = "Orchestrator-owned gates"
covers = ["CAP-3", "CAP-8", "CAP-9", "CAP-11"]
after = [{ epic = 3, needs = "the configurable-checks, hardened six-job pipeline" }]

[[epic]]
id = 5
slug = "epic-pipeline-dashboard"
title = "Pipeline status dashboard"
covers = ["CAP-10"]
after = [{ epic = 4, needs = "the orchestrator and both PR-comment gates built" }]
