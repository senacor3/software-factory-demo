title = "Frontend: Ford-inspired UX redesign"
description = "Restyles the three existing Angular pages (overview, create-tender, detail) per `ux-freight-tenders-ui/DESIGN.md` and `EXPERIENCE.md` -- a Ford.de-inspired visual identity -- and replaces the overview's and detail page's plain lists with sortable tables (single-column click-to-sort), per the same spine. No functional change: creating a tender, adding a remark/offer, and the closed-tender disabled state all keep their current behavior and German copy."
verify = "The three pages visually match DESIGN.md's palette/typography/components; the tender list and the detail page's remarks/offers render as tables whose columns sort ascending/descending on selection, per EXPERIENCE.md's Component Patterns; the existing frontend test suite (extended for sorting) and `npm run lint`/`npm run build` all pass."
covers = ["D2"]
after = [6]
hitl = false
risk = "medium"
references = ["../ux-freight-tenders-ui/DESIGN.md", "../ux-freight-tenders-ui/EXPERIENCE.md"]

[[entry]]
