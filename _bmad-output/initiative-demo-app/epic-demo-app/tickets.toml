# tickets.toml — epic-demo-app's agreed children, in build order.
# Tracer bullet: entry 1. Refactor sweep: entry 8. Closing end-to-end suite: entry 9.
# Entry 10 added 2026-10-11, moved from initiative-light-factory's epic-pipeline-hardening as "Fix loop engaged on a live run"; placed before entry 8.
# Narrowed the same day to "Give the review agent more instructions" once the fix loop engaged live on the pipeline itself.
# Entry 11 added 2026-10-12: "Frontend: Ford-inspired UX redesign", backed by ux-freight-tenders-ui/DESIGN.md + EXPERIENCE.md. Placed after entry 6 (the last entry touching the three existing pages) and before entry 8, whose `after` was extended to include it.

[[entry]]
id = 1
type = "story"
title = "Project scaffold & CI"
description = "Scaffolds the Spring Boot backend and Angular frontend as separate buildable projects under `freight-tenders/` in this repo, with CI running each project's build, test, and lint, and a trivial end-to-end path (a health-check endpoint rendered on one Angular page, its label in German) proving the two connect."
verify = "CI goes green on a fresh clone, running build, test, and lint for both projects; the Angular page shows a live value from the Spring Boot health endpoint behind a German-language label."
covers = ["D1"]
after = []
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "Tender domain model & persistence"
description = "Models Tender (origin, destination, status open/closed) with Remark and Offer as child records atop entry 1's Spring Boot scaffold, persisted via Spring Data, backed by unit tests for the open/closed state transition."
verify = "A unit test creates a tender, adds a remark and an offer, and closing the tender is reflected in its persisted status."
covers = ["D2"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Create/close-tender API + enforce the open/closed rule"
description = "Adds POST /tenders and POST /tenders/{id}/close atop entry 2's domain model, enforcing that remarks/offers can only be added to an open tender -- the epic's one non-trivial business rule."
verify = "At the service layer, a test asserts adding a remark/offer to a closed tender is rejected with a clear error; creating and closing a tender both succeed via the API."
covers = ["D2"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Tender overview + detail API"
description = "Adds GET /tenders (filterable open/closed) and GET /tenders/{id} with its remarks and offers, plus POST endpoints to add a remark or offer to an existing open tender, re-enforcing entry 3's rule at the HTTP layer now that these endpoints exist."
verify = "A test lists open and closed tenders filtered correctly, fetches one tender's full detail including its remarks and offers, and confirms POSTing a remark/offer against a closed tender is rejected via these endpoints."
covers = ["D2"]
after = [3]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Frontend: tender overview"
description = "An Angular view listing open and closed tenders, consuming entry 4's list endpoint, with all labels and messages in German -- the backend API/data stay English, only this UI layer translates."
verify = "The overview page shows open and closed tenders separately with German labels, matching what the backend returns."
covers = ["D2"]
after = [4]
hitl = false
risk = "low"

[[entry]]
id = 6
type = "story"
title = "Frontend: create & view tender"
description = "An Angular form to create a new tender (entry 3's create endpoint) and a detail page for one tender showing its remarks/offers with add-forms (entry 4's endpoints), disabled once the tender is closed -- all form labels, buttons, and messages (including the disabled-state explanation) in German."
verify = "Creating a tender via the German-labeled form shows it in entry 5's overview; its detail page accepts a remark and an offer while open, and the add-forms are disabled once closed with a German message explaining why."
covers = ["D2"]
after = [5]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Point light-factory at the demo app"
description = "Adds the demo app's build, test, and lint commands to the repo's checks config (and any runner toolchain setup they need), so a pipeline run on a story touching `freight-tenders/` checks the app itself -- the pipeline, its Environments, and its secrets already exist in this repo, so nothing is copied; needs only entry 1's scaffold and touches none of entries 2-6's src/ files, so it can build alongside them."
verify = "A trivial story touching `freight-tenders/` pauses at plan-approval, and after approval its evidence/checks/ records show the app's backend and frontend build, test, and lint commands ran and passed."
covers = ["D3"]
after = [1]
hitl = true
risk = "medium"
unknown = "Waits on initiative-light-factory's epic-pipeline-hardening entry 1 (the per-repo checks config) -- a cross-initiative dependency no `after` can express; the config's shape, and whether factory/'s own checks still run on a demo-app story, come from there."

[[entry]]
id = 10
type = "story"
title = "Give the review agent more instructions"
description = "Extends the review agent's instructions (`.claude/skills/light-factory-review/SKILL.md`) so its review goes beyond reading the implementation against the plan's subtasks -- narrowed 2026-10-11 from \"Fix loop engaged on a live run\", whose live proof was delivered on the pipeline itself (run 38150142797) before this entry started."
verify = "The review skill's added instructions are merged, and a live run on a freight-tenders story shows the review applying them (its review.md or findings refer to something the old instructions did not ask for)."
covers = []
after = [7]
hitl = true
risk = "medium"
unknown = "Which instructions to add is not settled -- candidates are judging behavior and edge cases beyond the plan's subtasks, the adequacy of the tests, and leftover or unremovable files (the implementation agent cannot delete a file); decide with the user at refine time. Editing the review skill is pipeline logic, which this epic's Boundaries otherwise exclude (see the epic's Notes)."
references = [".claude/skills/light-factory-review/SKILL.md", "../../initiative-light-factory/architecture-light-factory/architecture-light-factory.md#ad-11", "story-give-the-review-agent-more-instructions-plan.md"]

[[entry]]
