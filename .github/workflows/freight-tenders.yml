name: freight-tenders

# CI for the freight-tenders demo app, independent of light-factory's own
# workflow (.github/workflows/light-factory.yml) and tooling. Two jobs, each
# building/testing/linting its own project -- see freight-tenders/README.md.

on:
  push:
    paths:
      - 'freight-tenders/**'
  pull_request:
    paths:
      - 'freight-tenders/**'

jobs:
  backend:
    name: "Backend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freight-tenders/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build and test
        run: mvn -B verify

      - name: Lint (formatting)
        run: mvn -B spotless:check

  frontend:
    name: "Frontend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freight-tenders/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: freight-tenders/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --watch=false

      - name: Lint
        run: npm run lint
