name: freight-tenders

# CI for the freight-tenders demo app, independent of light-factory's own
# workflow and tooling. Two jobs, each building/testing/linting its own
# project -- see freight-tenders/README.md.
#
# push-to-main only; PR-time checks are already covered by its own `checks` job
#
# No `on.push.paths` filter; The `changes` job re-derives changed paths
# via dorny/paths-filter instead, and backend/frontend are gated on that.

on:
  push:
    branches: [main]

jobs:
  changes:
    name: "Detect changes"
    runs-on: ubuntu-24.04
    outputs:
      freight-tenders: ${{ steps.filter.outputs.freight-tenders }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            freight-tenders:
              - 'freight-tenders/**'

  backend:
    name: "Backend"
    needs: changes
    if: needs.changes.outputs.freight-tenders == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: freight-tenders/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build and test
        run: mvn -B verify

      - name: Lint (formatting)
        run: mvn -B spotless:check

      - name: Static analysis
        run: mvn -B spotbugs:check

  frontend:
    name: "Frontend"
    needs: changes
    if: needs.changes.outputs.freight-tenders == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: freight-tenders/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: freight-tenders/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --watch=false

      - name: Lint
        run: npm run lint

      - name: Static analysis
        run: npm run static-analysis
