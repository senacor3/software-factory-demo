name: implementation-checks-review

# Second of the software-factory pipeline's three dispatchable files (AD-2): runs
# `implementation` -> `checks` -> `checks-fix-loop` -> `review`, in the same
# internal order as the old single workflow's own needs: chain, now fed by
# workflow_dispatch inputs instead of a cross-job needs: from an `analysis` job
# that lives in a separate file.
#
# `implementation` is no longer gated by a `plan-approval` GitHub Environment --
# that gate is now owned entirely by the orchestrator's PR-comment command
# grammar (`/approve`/`/rework`/`/reject`, AD-2), read off the one GitHub webhook
# event the App subscribes to and acted on directly by `orchestrator/handler.py`
# before this workflow is ever dispatched. This file only ever runs once
# `/approve` has already triggered the `workflow_dispatch` call; nothing
# GitHub-native gates it anymore. (The repo-settings `plan-approval` Environment
# resource itself is left in place until a later entry removes it.)
#
# `implementation`'s own `outputs:` re-expose its two workflow_dispatch inputs
# (`story-slug`/`run-id`) as job outputs purely so every later job in this file
# keeps reading `needs.implementation.outputs.*` -- the exact pattern the old
# `needs.analysis.outputs.*` reads used, now sourced from this file's first job
# instead of a job in another file. `run-id` itself is never recomputed here --
# it is accepted verbatim from whatever dispatched this file (analysis.yml).
#
# Also carries a `close-rejected-pr`-equivalent job for this file's own gate
# (plan-approval): cross-file `needs:` is impossible, so AD-16's existing
# reject-cleanup mechanism is duplicated per downstream file rather than removed
# (superseded by this entry's direct /reject webhook handling -- this job is now
# effectively dead weight on the Gate-1 reject path, since `/reject` closes the
# PR itself before this file is ever dispatched again; left in place per this
# entry's own boundaries -- removing it is entry 10's scope, not this one's).
#
# See _bmad-output/initiative-light-factory/architecture-light-factory/
# architecture-light-factory.md for the decisions (AD-n) the comments below cite.

on:
  workflow_dispatch:
    inputs:
      story-slug:
        description: "The story slug derived by analysis.yml (its story-slug job output)"
        required: true
        type: string
      run-id:
        description: "The run-id derived by analysis.yml (its run-id job output) -- accepted verbatim, never recomputed here"
        required: true
        type: string

# The two downstream files no longer receive story_file at all, so their groups
# key on story-slug+run-id instead -- the only identifiers they actually have. A
# second dispatch for the same story-slug+run-id while a run is still in flight --
# including one paused at the plan-approval gate -- cancels that run outright.
concurrency:
  group: implementation-checks-review-${{ github.event.inputs.story-slug }}-${{ github.event.inputs.run-id }}
  cancel-in-progress: true

jobs:
  implementation:
    name: "Implementation"
    runs-on: ubuntu-24.04
    # AD-5/AD-6: contents:write scopes checkout_branch.py's git fetch/checkout and
    # commit_push_implementation.py's git add/commit/push, nothing else -- the
    # implementation agent's own tool-allowlist stays Read/Write/Edit/Grep/Glob
    # regardless (no Bash/git/gh tool ever reaches it). No PR is opened or closed
    # here (the analysis job already opened it) and no PR comment is posted here
    # either (that moved to the `review` job) -- so no pull-requests scope is needed.
    permissions:
      contents: write
    outputs:
      # Passthrough only -- these are this job's own workflow_dispatch inputs,
      # re-exposed so `checks`/`checks-fix-loop`/`review` below keep reading
      # `needs.implementation.outputs.*`, matching the needs: chain pattern the
      # old single workflow's `needs.analysis.outputs.*` reads already used.
      story-slug: ${{ github.event.inputs.story-slug }}
      run-id: ${{ github.event.inputs.run-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: |
            factory/graph/**/*.py
            factory/scripts/**/*.py

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      # Runs the implementation skill via implementation_graph.py (CAP-4 scoped
      # implementation) -- see story-implementation-agent-plan.md. CLAUDE_CODE_OAUTH_TOKEN
      # is read automatically by the `claude` CLI from the environment (AD-9). GH_TOKEN is
      # not needed here -- unlike the analysis job, no `gh` call happens in this job (no
      # PR is opened/closed, only checkout_branch.py/commit_push_implementation.py's plain
      # `git` calls, authenticated via the checkout action's own token).
      - name: Run implementation
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          uv run factory/graph/implementation_graph.py \
            --story-slug "${{ github.event.inputs.story-slug }}" \
            --run-id "${{ github.event.inputs.run-id }}"

  checks:
    name: "Quality Assurance"
    needs: implementation
    runs-on: ubuntu-24.04
    # AD-5/AD-6: contents:write scopes checkout_branch.py's git fetch/checkout and
    # commit_push_implementation.py's git add/commit/push, nothing else -- this job
    # runs no agent and opens/closes no PR.
    #
    # AD-10 addendum (backlog bug 4): "a check failed" leaves this job as an output,
    # not as the job's own conclusion -- see "Report check outcomes" below. The
    # `checks-fix-loop` and `review` jobs' `if:` read it.
    outputs:
      any-check-failed: ${{ steps.report.outputs.any-check-failed }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: |
            factory/graph/**/*.py
            factory/scripts/**/*.py

      # This job starts on a fresh runner -- `actions/checkout@v7` above checks out
      # the default ref, not the story's branch -- so it must explicitly check out
      # the same branch the implementation job already committed to (AD-8/AD-12).
      - name: Checkout implementation branch
        run: |
          uv run factory/scripts/checkout_branch.py \
            --story-slug "${{ needs.implementation.outputs.story-slug }}" \
            --run-id "${{ needs.implementation.outputs.run-id }}"

      # Runner toolchain setup for the checks below (AD-6 addendum): the Java/Node
      # versions .github/post-implementation-checks.yml's `toolchains:` mapping
      # names. Lives in a local composite action because the `checks-fix-loop` job
      # needs the identical setup for its re-checks (backlog bug 5) -- see
      # .github/actions/checks-toolchain/action.yml.
      - name: Set up checks toolchain
        uses: ./.github/actions/checks-toolchain

      # Prepares the checkout for the checks below (AD-6 addendum, backlog bug 5):
      # runs the config's `setup:` commands (e.g. a dependency install), so no check
      # relies on an earlier check having run. The `checks-fix-loop` job re-runs only
      # the failed check(s) and runs this same setup before each re-check, from
      # checks_fix_loop_graph.py. `continue-on-error: true` like the checks, so they
      # still run and leave evidence; "Fail job if setup failed" below then fails the
      # job. Its result is committed as evidence/checks/setup.json beside theirs.
      - name: Setup check workspace
        id: setup
        continue-on-error: true
        run: |
          uv run factory/scripts/run_checks.py setup \
            --story-slug "${{ needs.implementation.outputs.story-slug }}" \
            --run-id "${{ needs.implementation.outputs.run-id }}"

      # CAP-5 mechanical checks (AD-6): 5 direct pipeline steps, never a graph node or
      # agent tool call. Each step runs the commands the repo configures for that
      # check in .github/post-implementation-checks.yml, read as it is on origin/main
      # so a story cannot change them by editing the config (run_checks.py itself
      # still comes from the story branch); a check with no command records status:
      # skipped (never pass) and exits 0, which is `security` and `static_analysis`
      # in this repo. See factory/scripts/run_checks.py and AD-6's addendum.
      #
      # AD-10 addendum: each step has `continue-on-error: true` so all 5 always run
      # and leave evidence, regardless of an earlier one failing -- a failing step's
      # own outcome is still recorded (`steps.<id>.outcome`), and "Report check
      # outcomes" below turns those into this job's `any-check-failed` output, with
      # every check's evidence durable for the `checks-fix-loop` job to read.
      - name: Build check
        id: build
        continue-on-error: true
        run: |
          uv run factory/scripts/run_checks.py build \
            --story-slug "${{ needs.implementation.outputs.story-slug }}" \
            --run-id "${{ needs.implementation.outputs.run-id }}"

      - name: Test check
        id: test
        continue-on-error: true
        run: |
          uv run factory/scripts/run_checks.py test \
            --story-slug "${{ needs.implementation.outputs.story-slug }}" \
            --run-id "${{ needs.implementation.outputs.run-id }}"

      - name: Lint check
        id: lint
        continue-on-error: true
        run: |
          uv run factory/scripts/run_checks.py lint \
            --story-slug "${{ needs.implementation.outputs.story-slug }}" \
            --run-id "${{ needs.implementation.outputs.run-id }}"

      - name: Security check
        id: security
        continue-on-error: true
        run: |
          uv run factory/scripts/run_checks.py security \
            --story-slug "${{ needs.implementation.outputs.story-slug }}" \
            --run-id "${{ needs.implementation.outputs.run-id }}"

      - name: Static analysis check
        id: static_analysis
        continue-on-error: true
        run: |
          uv run factory/scripts/run_checks.py static_analysis \
            --story-slug "${{ needs.implementation.outputs.story-slug }}" \
            --run-id "${{ needs.implementation.outputs.run-id }}"

      # AD-10 addendum (backlog bug 5): `checks.md` is written by the fix loop, which
      # only runs when this job reported a failed check -- so when a later attempt
      # of this job finds none, nothing else would correct an `unresolved-after-cap`
      # an earlier attempt's loop stamped. A later attempt of this job means a full
      # re-run: "Re-run failed jobs" does not re-run it, since a failed check does
      # not fail it (backlog bug 4). This resets it to `resolved` in exactly that case
      # (the file exists, setup did not fail, and all 5 checks above passed or were
      # skipped) and is a
      # no-op in every other, including a first attempt, where no `checks.md` exists.
      - name: Reconcile checks state
        if: always()
        run: |
          uv run factory/scripts/run_checks.py reconcile \
            --story-slug "${{ needs.implementation.outputs.story-slug }}" \
            --run-id "${{ needs.implementation.outputs.run-id }}"

      # Always commits this job's evidence (AD-10), extending the existing
      # git-based state mechanism rather than adding a second one (e.g. workflow
      # artifacts) -- so the `review`/`checks-fix-loop` jobs' checkout always has
      # it, regardless of whether any of the 5 checks above failed or whether a fix
      # cycle later also commits. `if: always()` -- the step above's
      # `continue-on-error: true` already keeps the job going on a failing check,
      # but without this the job would still skip straight past a *crashing* step
      # (e.g. an uncaught non-check error) the same way it did before this addendum.
      - name: Commit checks evidence
        if: always()
        run: |
          uv run factory/scripts/commit_push_implementation.py \
            --story-slug "${{ needs.implementation.outputs.story-slug }}" \
            --run-id "${{ needs.implementation.outputs.run-id }}" \
            --label "Quality Assurance"

      # AD-10 addendum (backlog bug 4): a failed check does not fail this job. GitHub
      # Actions takes a run's conclusion from its worst job, so a `checks` job that
      # ended in `failure` to start the fix loop left the whole run red even when the
      # loop recovered and the story merged. Instead this writes the job's
      # `any-check-failed` output from the 5 check steps' recorded outcomes, after
      # their evidence has been committed above; `checks-fix-loop` starts on it and
      # `review` waits on it. A value run_checks.py does not know as a step outcome
      # (a mistyped step id evaluates to an empty string) fails this step, and so
      # the job, rather than counting as "nothing failed".
      - name: Report check outcomes
        id: report
        if: always()
        run: |
          uv run factory/scripts/run_checks.py any-check-failed \
            "${{ steps.build.outcome }}" \
            "${{ steps.test.outcome }}" \
            "${{ steps.lint.outcome }}" \
            "${{ steps.security.outcome }}" \
            "${{ steps.static_analysis.outcome }}" >> "$GITHUB_OUTPUT"

      # A failed setup is not a check failure the fix loop could repair -- the
      # checkout was never prepared, so whatever the checks then reported says
      # nothing about the code. It fails this job for real: neither the fix loop
      # nor `review` runs, and "Re-run failed jobs" re-runs this job, which is how a
      # transient install failure recovers.
      - name: Fail job if setup failed
        if: always() && steps.setup.outcome == 'failure'
        run: |
          echo "setup failed: the checkout could not be prepared for the checks" >&2
          exit 1

  checks-fix-loop:
    name: "Quality Assurance fix loop"
    needs: [implementation, checks]
    # AD-10: runs only when `checks` reported a failed check -- `checks` keeps its
    # documented "runs no agent" invariant and this job only pays agent-setup cost
    # on that path. The signal is `checks`' `any-check-failed` output, not its
    # conclusion (backlog bug 4): `checks` ends `success` on a failed check, and a
    # `checks` job that itself failed (a crashed step, a failed setup) has nothing
    # this loop could repair. `!cancelled()` keeps it off a concurrency-cancelled
    # run, same as `close-rejected-pr` below.
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.checks.outputs.any-check-failed == 'true' }}
    runs-on: ubuntu-24.04
    # AD-5/AD-6: contents:write scopes checkout_branch.py's git fetch/checkout and
    # implementation_graph.py's/commit_push_implementation.py's git calls, nothing
    # else -- no PR is opened/closed/commented on here.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: |
            factory/graph/**/*.py
            factory/scripts/**/*.py

      - name: Checkout implementation branch
        run: |
          uv run factory/scripts/checkout_branch.py \
            --story-slug "${{ needs.implementation.outputs.story-slug }}" \
            --run-id "${{ needs.implementation.outputs.run-id }}"

      # The same toolchain setup the `checks` job runs (backlog bug 5), so a
      # re-check runs under the Java/Node versions the first check did. The
      # dependency install the re-checks also need is not a step here: the fix loop
      # runs the config's `setup:` commands itself before each re-check, after the
      # agent's edits.
      - name: Set up checks toolchain
        id: toolchain
        uses: ./.github/actions/checks-toolchain

      # Node for the Claude Code CLI below -- only when the checks config names no
      # Node version, so the checks' own Node is never replaced by this one.
      - name: Install Node
        if: steps.toolchain.outputs.node == ''
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      # AD-10's bounded checks fix loop (mirrors AD-11): reads the evidence `checks`
      # already committed to learn which check(s) failed, re-engages the
      # implementation skill with that as context, re-runs only those check(s), and
      # repeats up to the same cap of 2 cycles. Still failing at the cap fails this
      # step (and so this job) -- `review` below only proceeds when `checks` reported
      # no failed check or this job ended `success`. CLAUDE_CODE_OAUTH_TOKEN is read
      # automatically by the `claude` CLI from the environment (AD-9).
      - name: Run checks fix loop
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          uv run factory/graph/checks_fix_loop_graph.py \
            --story-slug "${{ needs.implementation.outputs.story-slug }}" \
            --run-id "${{ needs.implementation.outputs.run-id }}"

      # Always commits this job's evidence (AD-10), same rationale as the `checks`
      # job's own commit step -- `checks_fix_loop_graph.py`'s own fix-cycle commits
      # (via implementation_graph.py) are conditional on a cycle running; this step
      # guarantees checks.md and any rechecked evidence/checks/ are persisted
      # regardless of the outcome, including the capped-out failing case.
      - name: Commit checks-fix-loop evidence
        if: always()
        run: |
          uv run factory/scripts/commit_push_implementation.py \
            --story-slug "${{ needs.implementation.outputs.story-slug }}" \
            --run-id "${{ needs.implementation.outputs.run-id }}" \
            --label "Quality Assurance fix loop"

  review:
    name: "Review & fix loop"
    needs: [implementation, checks, checks-fix-loop]
    # AD-10: proceeds when `checks` reported no failed check, or when
    # `checks-fix-loop` ran and resolved what it reported -- `checks-fix-loop` is
    # `skipped` (not `success`) on the all-pass-first-try path, so only one of the
    # two sides is ever true. `checks` ending `success` is required either way but
    # no longer enough (backlog bug 4): it ends `success` on a failed check too, so
    # this must never run on that alone. The output is matched against the literal
    # `false`, an allow-list like `implementation`'s own gate above -- an empty or
    # unknown value keeps this job from running rather than letting it through.
    # `!cancelled()` preserves this job's prior
    # behavior on a concurrency-cancelled run. Bracket notation
    # (`needs['checks-fix-loop']`), not dot notation, because GitHub Actions
    # expressions parse a bare `-` in a property name as the subtraction operator.
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.checks.outputs.any-check-failed == 'false' || needs['checks-fix-loop'].result == 'success') }}
    runs-on: ubuntu-24.04
    # AD-5: contents:write scopes checkout_branch.py/commit_push_implementation.py's
    # git calls (including fix_loop_graph.py's own fix-cycle commits);
    # pull-requests:write scopes the evidence-approval summary's `gh pr comment` call
    # (AD-4/CAP-8).
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: |
            factory/graph/**/*.py
            factory/scripts/**/*.py

      - name: Checkout implementation branch
        run: |
          uv run factory/scripts/checkout_branch.py \
            --story-slug "${{ needs.implementation.outputs.story-slug }}" \
            --run-id "${{ needs.implementation.outputs.run-id }}"

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      # CAP-6 independent review (AD-5/AD-8/AD-10) + CAP-7 bounded fix loop (AD-11):
      # fix_loop_graph.py runs review_graph.py's review, and -- while findings remain
      # and the cycle count is under 2 -- re-engages the implementation skill with the
      # findings as context, reruns build/test, and reviews again. A review that
      # produces findings is a legitimate outcome, not a failure; hitting the 2-cycle
      # cap and stamping `unresolved-after-cap` is also legitimate, not a failure --
      # only a tooling failure (review/implementation CLI, checkout/commit/push) or a
      # build/test regression introduced by a fix cycle fails this step.
      # CLAUDE_CODE_OAUTH_TOKEN is read automatically by the `claude` CLI from the
      # environment (AD-9).
      - name: Run review (bounded fix loop)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          uv run factory/graph/fix_loop_graph.py \
            --story-slug "${{ needs.implementation.outputs.story-slug }}" \
            --run-id "${{ needs.implementation.outputs.run-id }}"

      # Always commits this job's evidence (AD-10), same rationale as the `checks`
      # job's own commit step -- `fix_loop_graph.py`'s own fix-cycle commits are
      # conditional on a cycle running; this step is what guarantees review.md and
      # evidence/review/ are persisted even on a clean first pass.
      - name: Commit review evidence
        run: |
          uv run factory/scripts/commit_push_implementation.py \
            --story-slug "${{ needs.implementation.outputs.story-slug }}" \
            --run-id "${{ needs.implementation.outputs.run-id }}" \
            --label Review

      # CAP-8 evidence-approval gate summary (AD-4): reads evidence/checks/*.json
      # (ticket 8) and review.md's status/fix_cycle + evidence/review/findings.json
      # (tickets 9/10), posts a concise summary as a PR comment via the shared
      # post_summary module. Runs -- and succeeds -- whether review.md's status is
      # `resolved` or `unresolved-after-cap`; both are legitimate, human-decides-at-
      # the-gate outcomes. GH_TOKEN authenticates the `gh pr comment` call.
      - name: Post evidence-approval summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run factory/scripts/post_evidence_summary.py \
            --story-slug "${{ needs.implementation.outputs.story-slug }}" \
            --run-id "${{ needs.implementation.outputs.run-id }}"

  close-rejected-pr:
    name: "Close PR on gate reject"
    needs: implementation
    # AD-2/AD-16: a reviewer rejecting plan-approval leaves `implementation` with
    # result `failure` and zero steps run -- indistinguishable from an ordinary
    # crash by `needs.implementation.result` alone -- and skips every job after it
    # in this file. So this job runs whenever `implementation` failed, and
    # close_rejected_pr.py decides from the run's own review history whether that
    # was a reject. `!cancelled()` keeps it off a concurrency-cancelled (superseded,
    # AD-15) run, whose PR the superseding run closes itself; a successful run has
    # no `failure` result and never gets here. Reads story-slug/run-id straight from
    # this file's own workflow_dispatch inputs -- not via `needs.implementation.
    # outputs.*` -- so this job never depends on `implementation` having run any
    # step to produce them, which matters exactly on the reject path this job exists
    # for.
    if: ${{ !cancelled() && needs.implementation.result == 'failure' }}
    runs-on: ubuntu-24.04
    # AD-5: actions:read scopes the review-history call (`gh api
    # .../actions/runs/<id>/approvals`), pull-requests:write the `gh pr list` + `gh pr
    # close --comment` calls, contents:read the checkout -- no push, no merge, no
    # branch deletion. A deterministic script, never an agent (no `claude` CLI
    # invocation anywhere in this job).
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: |
            factory/graph/**/*.py
            factory/scripts/**/*.py

      # The gate checked is this file's own: plan-approval, hardcoded -- this file
      # only ever gates `implementation` on it. --github-run-id is the numeric id the
      # review-history API wants, this file's own `github.run_id` (never another
      # file's). An ordinary failure exits 0 with "not a reject" and leaves the PR
      # open; only a `gh`/API failure fails this step.
      - name: Close PR if the gate was rejected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run factory/scripts/close_rejected_pr.py \
            --story-slug "${{ github.event.inputs.story-slug }}" \
            --run-id "${{ github.event.inputs.run-id }}" \
            --github-run-id "${{ github.run_id }}" \
            --gate plan-approval
