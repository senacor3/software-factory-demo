name: light-factory

# Pipeline skeleton & gates (ticket 1).
#
# Job-level FSM skeleton only: analysis -> implementation (gated by the
# plan-approval Environment) -> merge (gated by the evidence-approval
# Environment). Stub steps only -- no real agent, state-file, PR, or merge
# logic. See _bmad-output/initiative-light-factory/epic-light-factory-pipeline/
# story-pipeline-skeleton-gates-plan.md for the plan this implements.

on:
  workflow_dispatch:
    inputs:
      story_file:
        description: "Path to the triggering story file (e.g. stories/trivial-test-story.md)"
        required: true
        type: string

# Keyed on the raw story_file input (not a derived slug) -- the concurrency
# key is evaluated at trigger time from the workflow's own context, before
# any job runs, so it cannot read a job output. A second dispatch for the
# same story_file while a run is still in flight -- including one paused at
# a gate -- cancels that run outright.
concurrency:
  group: light-factory-${{ github.event.inputs.story_file }}
  cancel-in-progress: true

jobs:
  analysis:
    name: "Analysis"
    runs-on: ubuntu-latest
    # AD-5/AD-12: contents:write + pull-requests:write scope the new deterministic
    # open_implementation_pr.py script's git push + gh pr create, nothing else -- the
    # analysis agent's own tool-allowlist stays read-only (Read Grep Glob) regardless.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      story-slug: ${{ steps.derive.outputs.story-slug }}
      run-id: ${{ steps.derive.outputs.run-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Derive story-slug and run-id
        id: derive
        run: |
          uv run factory/scripts/state_io.py derive \
            --story-file "${{ github.event.inputs.story_file }}" \
            --github-run-id "${{ github.run_id }}" \
            >> "$GITHUB_OUTPUT"

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      # Runs the analysis skill via analysis_graph.py (CAP-1 intake judgment, CAP-2
      # proposal) -- see story-job-1-intake-analysis-plan.md. CLAUDE_CODE_OAUTH_TOKEN is
      # read automatically by the `claude` CLI from the environment (AD-9), live-verified
      # 2026-10-02 (run 36970131400). GH_TOKEN authenticates the `gh` CLI calls inside
      # open_implementation_pr.py once a non-halted result proceeds to open the PR
      # (AD-12) -- the job's `permissions:` block above only grants the API scope; `gh`
      # itself needs a token explicitly in its environment or every `gh pr list`/`gh pr
      # create` call fails auth, even though the permission is correctly present.
      - name: Run analysis
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run factory/graph/analysis_graph.py \
            --story-file "${{ github.event.inputs.story_file }}" \
            --story-slug "${{ steps.derive.outputs.story-slug }}" \
            --run-id "${{ steps.derive.outputs.run-id }}"

  implementation:
    name: "Implementation"
    needs: analysis
    environment: plan-approval
    runs-on: ubuntu-latest
    # AD-5/AD-6: contents:write scopes checkout_branch.py's git fetch/checkout and
    # commit_push_implementation.py's git add/commit/push, nothing else -- the
    # implementation agent's own tool-allowlist stays Read/Write/Edit/Grep/Glob
    # regardless (no Bash/git/gh tool ever reaches it). No PR is opened or closed
    # here (the analysis job already opened it) and no PR comment is posted here
    # either (that moved to the `review` job) -- so no pull-requests scope is needed.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      # Real pass/fail test of the needs: propagation (AD-8/AD-15): independently
      # recompute the expected story-slug/run-id (same derivation, same github.run_id,
      # which is constant across every job in this run) and compare against what this
      # job actually received via needs.analysis.outputs -- fails loudly on mismatch.
      #
      # Verification-only: `$expected` below is discarded after this comparison and is
      # never used to locate a file, name a branch/PR, or otherwise stand in for the
      # propagated value ("Run implementation" below uses needs.analysis.outputs.*
      # exclusively). AD-8's "no job independently re-derives the slug from any other
      # source" rule guards against a job acting on a self-computed slug instead of the
      # propagated one; this step never acts on $expected, only asserts equality, so the
      # collision risk the rule exists to prevent does not arise here. Do not read this
      # step as license for a future job to re-derive and use its own value.
      - name: Assert story-slug/run-id propagation matches AD-8 derivation
        run: |
          set -euo pipefail
          expected="$(uv run factory/scripts/state_io.py derive \
            --story-file "${{ github.event.inputs.story_file }}" \
            --github-run-id "${{ github.run_id }}")"
          expected_slug="$(printf '%s\n' "$expected" | sed -n 's/^story-slug=//p')"
          expected_run_id="$(printf '%s\n' "$expected" | sed -n 's/^run-id=//p')"
          received_slug="${{ needs.analysis.outputs.story-slug }}"
          received_run_id="${{ needs.analysis.outputs.run-id }}"
          if [ "$expected_slug" != "$received_slug" ] || [ "$expected_run_id" != "$received_run_id" ]; then
            echo "MISMATCH: expected story-slug=$expected_slug run-id=$expected_run_id, got story-slug=$received_slug run-id=$received_run_id" >&2
            exit 1
          fi
          echo "PASS: propagation verified -- story-slug=$received_slug run-id=$received_run_id"

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      # Runs the implementation skill via implementation_graph.py (CAP-4 scoped
      # implementation) -- see story-implementation-agent-plan.md. CLAUDE_CODE_OAUTH_TOKEN
      # is read automatically by the `claude` CLI from the environment (AD-9). GH_TOKEN is
      # not needed here -- unlike the analysis job, no `gh` call happens in this job (no
      # PR is opened/closed, only checkout_branch.py/commit_push_implementation.py's plain
      # `git` calls, authenticated via the checkout action's own token).
      - name: Run implementation
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          uv run factory/graph/implementation_graph.py \
            --story-slug "${{ needs.analysis.outputs.story-slug }}" \
            --run-id "${{ needs.analysis.outputs.run-id }}"

  checks:
    name: "Checks"
    needs: [analysis, implementation]
    runs-on: ubuntu-latest
    # AD-5/AD-6: contents:write scopes checkout_branch.py's git fetch/checkout and
    # commit_push_implementation.py's git add/commit/push, nothing else -- this job
    # runs no agent and opens/closes no PR.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      # This job starts on a fresh runner -- `actions/checkout@v7` above checks out
      # the default ref, not the story's branch -- so it must explicitly check out
      # the same branch the implementation job already committed to (AD-8/AD-12).
      - name: Checkout implementation branch
        run: |
          uv run factory/scripts/checkout_branch.py \
            --story-slug "${{ needs.analysis.outputs.story-slug }}" \
            --run-id "${{ needs.analysis.outputs.run-id }}"

      # CAP-5 mechanical checks (AD-6): 4 direct pipeline steps, never a graph node or
      # agent tool call. build/test are real checks -- a failing step exits non-zero and
      # stops the job; lint/security have no tool wired for v1 and always record
      # status: skipped (never pass), so they always exit 0. See
      # factory/scripts/run_checks.py and story-mechanical-checks-plan.md.
      - name: Build check
        run: |
          uv run factory/scripts/run_checks.py build \
            --story-slug "${{ needs.analysis.outputs.story-slug }}" \
            --run-id "${{ needs.analysis.outputs.run-id }}"

      - name: Test check
        run: |
          uv run factory/scripts/run_checks.py test \
            --story-slug "${{ needs.analysis.outputs.story-slug }}" \
            --run-id "${{ needs.analysis.outputs.run-id }}"

      - name: Lint check (placeholder)
        run: |
          uv run factory/scripts/run_checks.py lint \
            --story-slug "${{ needs.analysis.outputs.story-slug }}" \
            --run-id "${{ needs.analysis.outputs.run-id }}"

      - name: Security check (placeholder)
        run: |
          uv run factory/scripts/run_checks.py security \
            --story-slug "${{ needs.analysis.outputs.story-slug }}" \
            --run-id "${{ needs.analysis.outputs.run-id }}"

      # Always commits this job's evidence (AD-10), extending the existing
      # git-based state mechanism rather than adding a second one (e.g. workflow
      # artifacts) -- so the `review` job's checkout always has it, regardless of
      # whether a fix cycle later also commits.
      - name: Commit checks evidence
        run: |
          uv run factory/scripts/commit_push_implementation.py \
            --story-slug "${{ needs.analysis.outputs.story-slug }}" \
            --run-id "${{ needs.analysis.outputs.run-id }}" \
            --label Checks

  review:
    name: "Review & fix loop"
    needs: [analysis, implementation, checks]
    runs-on: ubuntu-latest
    # AD-5: contents:write scopes checkout_branch.py/commit_push_implementation.py's
    # git calls (including fix_loop_graph.py's own fix-cycle commits);
    # pull-requests:write scopes the evidence-approval summary's `gh pr comment` call
    # (AD-4/CAP-8).
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Checkout implementation branch
        run: |
          uv run factory/scripts/checkout_branch.py \
            --story-slug "${{ needs.analysis.outputs.story-slug }}" \
            --run-id "${{ needs.analysis.outputs.run-id }}"

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      # CAP-6 independent review (AD-5/AD-8/AD-10) + CAP-7 bounded fix loop (AD-11):
      # fix_loop_graph.py runs review_graph.py's review, and -- while findings remain
      # and the cycle count is under 2 -- re-engages the implementation skill with the
      # findings as context, reruns build/test, and reviews again. A review that
      # produces findings is a legitimate outcome, not a failure; hitting the 2-cycle
      # cap and stamping `unresolved-after-cap` is also legitimate, not a failure --
      # only a tooling failure (review/implementation CLI, checkout/commit/push) or a
      # build/test regression introduced by a fix cycle fails this step.
      # CLAUDE_CODE_OAUTH_TOKEN is read automatically by the `claude` CLI from the
      # environment (AD-9).
      - name: Run review (bounded fix loop)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          uv run factory/graph/fix_loop_graph.py \
            --story-slug "${{ needs.analysis.outputs.story-slug }}" \
            --run-id "${{ needs.analysis.outputs.run-id }}"

      # Always commits this job's evidence (AD-10), same rationale as the `checks`
      # job's own commit step -- `fix_loop_graph.py`'s own fix-cycle commits are
      # conditional on a cycle running; this step is what guarantees review.md and
      # evidence/review/ are persisted even on a clean first pass.
      - name: Commit review evidence
        run: |
          uv run factory/scripts/commit_push_implementation.py \
            --story-slug "${{ needs.analysis.outputs.story-slug }}" \
            --run-id "${{ needs.analysis.outputs.run-id }}" \
            --label Review

      # CAP-8 evidence-approval gate summary (AD-4): reads evidence/checks/*.json
      # (ticket 8) and review.md's status/fix_cycle + evidence/review/findings.json
      # (tickets 9/10), posts a concise summary as a PR comment via the shared
      # post_summary module. Runs -- and succeeds -- whether review.md's status is
      # `resolved` or `unresolved-after-cap`; both are legitimate, human-decides-at-
      # the-gate outcomes. GH_TOKEN authenticates the `gh pr comment` call.
      - name: Post evidence-approval summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run factory/scripts/post_evidence_summary.py \
            --story-slug "${{ needs.analysis.outputs.story-slug }}" \
            --run-id "${{ needs.analysis.outputs.run-id }}"

  merge:
    name: "Merge"
    needs: [analysis, implementation, review]
    environment: evidence-approval
    runs-on: ubuntu-latest
    # AD-5/AD-14: contents:write + pull-requests:write scope merge_story.py's `gh pr
    # merge --squash --delete-branch` call -- a deterministic script, never an agent
    # (no `claude` CLI invocation anywhere in this job).
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      # CAP-9 approval and merge (AD-14): a deterministic pipeline step, triggered
      # automatically on evidence-approval's approval -- never an agent action. A
      # merge conflict or other `gh` failure just fails this step; auto-resolution
      # is out of scope -- the human resolves out-of-band and re-triggers.
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run factory/scripts/merge_story.py \
            --story-slug "${{ needs.analysis.outputs.story-slug }}" \
            --run-id "${{ needs.analysis.outputs.run-id }}"

  close-rejected-pr:
    name: "Close PR on gate reject"
    needs: [analysis, implementation, merge]
    # AD-2/AD-16: a reviewer rejecting a gate leaves the gated job with result
    # `failure` and zero steps run -- indistinguishable from an ordinary crash by
    # `needs.<job>.result` alone -- and skips every job after it. So this job runs
    # whenever a gated job failed, and close_rejected_pr.py decides from the run's
    # own review history whether that was a reject. `!cancelled()` keeps it off a
    # concurrency-cancelled (superseded, AD-15) run, whose PR the superseding run
    # closes itself; a successful run has no `failure` result and never gets here.
    if: ${{ !cancelled() && (needs.implementation.result == 'failure' || needs.merge.result == 'failure') }}
    runs-on: ubuntu-latest
    # AD-5: actions:read scopes the review-history call (`gh api
    # .../actions/runs/<id>/approvals`), pull-requests:write the `gh pr list` + `gh pr
    # close --comment` calls, contents:read the checkout -- no push, no merge, no
    # branch deletion. A deterministic script, never an agent (no `claude` CLI
    # invocation anywhere in this job).
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      # The gate checked is the one guarding the job that failed: plan-approval for
      # `implementation`, evidence-approval for `merge` (`merge` is `skipped`, never
      # `failure`, when `implementation` failed, so the two cases cannot overlap).
      # --github-run-id is the numeric id the review-history API wants; the run-id
      # output is `run-<id>` and names the branch. An ordinary failure exits 0 with
      # "not a reject" and leaves the PR open; only a `gh`/API failure fails this step.
      - name: Close PR if the gate was rejected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run factory/scripts/close_rejected_pr.py \
            --story-slug "${{ needs.analysis.outputs.story-slug }}" \
            --run-id "${{ needs.analysis.outputs.run-id }}" \
            --github-run-id "${{ github.run_id }}" \
            --gate "${{ needs.implementation.result == 'failure' && 'plan-approval' || 'evidence-approval' }}"
