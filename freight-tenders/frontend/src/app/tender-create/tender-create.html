<main class="page">
  <h1>Neue Ausschreibung erstellen</h1>

  <form class="form-card" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-field">
      <label for="origin">Von</label>
      <input id="origin" type="text" formControlName="origin" data-testid="origin-input" />
    </div>

    <div class="form-field">
      <label for="destination">Nach</label>
      <input
        id="destination"
        type="text"
        formControlName="destination"
        data-testid="destination-input"
      />
    </div>

    @if (submitError()) {
      <p class="form-error" data-testid="submit-error">{{ submitError() }}</p>
    }

    <div class="form-actions">
      <button
        type="submit"
        class="btn-primary"
        data-testid="submit"
        [disabled]="form.invalid || submitting()"
      >
        Erstellen
      </button>
      <a routerLink="/" class="btn-secondary" data-testid="cancel">Abbrechen</a>
    </div>
  </form>
</main>
